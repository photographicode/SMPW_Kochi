<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMPW Kochi - Duty Scheduler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS CDN for In-Browser Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .touch-manipulation { touch-action: manipulation; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950/40 text-slate-200 font-sans selection:bg-indigo-500/30 antialiased min-h-screen touch-manipulation">

    <div id="app-root">
        <div class="min-h-screen flex flex-col items-center justify-center text-slate-400 gap-4">
            <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            Connecting to SMPW Kochi Database...
        </div>
    </div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 max-w-sm w-full px-4 pointer-events-none"></div>

    <script>
        // =======================================================================
        // Configuration & Supabase Initialization
        // =======================================================================
        var CONFIG = {
            SUPABASE_URL: 'https://vffbprsuvrwkzvwnipvg.supabase.co',
            SUPABASE_ANON_KEY: 'sb_publishable_a2RUr35OTMoqN4FRA3aTgg_1kHxmFp1',
            LOCAL_STORAGE_KEY: 'smpw_kochi_cache_v7',
            ADMIN_SESSION_KEY: 'smpw_admin_auth_v7',
            USER_SESSION_KEY: 'smpw_user_auth_v7',
            FALLBACK_PIN: '9847'
        };

        var supabaseClient = null;
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        }

        // =======================================================================
        // App State
        // =======================================================================
        var state = {
            dataLoaded: false,
            isSyncing: false,
            syncError: false,
            locations: [],
            shifts: [],
            slots: [],
            bookings: [],
            contacts: [],
            availableDates: [],
            selectedDate: null,
            isAdmin: false,
            currentUser: null, // { phone: '', full_name: '' }
            showAdminLogin: false,
            loginError: false,
            editingLocationId: null,
            realtimeChannel: null
        };

        // =======================================================================
        // Utilities (Legacy-Safe JavaScript)
        // =======================================================================
        function generateNext30Days(baseDate) {
            var dates = [];
            var start = baseDate ? new Date(baseDate) : new Date();
            for (var i = 0; i < 31; i++) {
                var nextDate = new Date(start);
                nextDate.setDate(start.getDate() + i);
                dates.push(nextDate);
            }
            return dates;
        }

        function formatDateKey(dateObj) {
            if (!dateObj) return '';
            var d = new Date(dateObj);
            var year = d.getFullYear();
            var month = ('0' + (d.getMonth() + 1)).slice(-2);
            var day = ('0' + d.getDate()).slice(-2);
            return year + '-' + month + '-' + day;
        }

        function formatDisplayDate(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatShortDate(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function formatMonth(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { month: 'short' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatMapUrl(rawUrl) {
            if (!rawUrl) return '';
            var trimmed = rawUrl.trim();
            if (trimmed.indexOf('http://') === 0 || trimmed.indexOf('https://') === 0) return trimmed;
            return 'https://maps.google.com/?q=' + encodeURIComponent(trimmed);
        }

        function sha256(str) {
            var buffer = new TextEncoder('utf-8').encode(str);
            return crypto.subtle.digest('SHA-256', buffer).then(function(hashBuffer) {
                var hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return ('00' + b.toString(16)).slice(-2); }).join('');
            });
        }

        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            var bgStyle = 'bg-slate-900 border-white/10 text-white';
            if (type === 'error') bgStyle = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
            if (type === 'success') bgStyle = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';

            toast.className = 'pointer-events-auto p-3.5 rounded-2xl border shadow-2xl text-xs font-semibold flex items-center justify-between transition-all duration-300 ' + bgStyle;
            toast.innerHTML = '<span>' + escapeHtml(message) + '</span>';
            container.appendChild(toast);

            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 3500);
        }

        // =======================================================================
        // Local Cache & Persistence
        // =======================================================================
        var StorageEngine = {
            getCache: function() {
                try {
                    var data = localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY);
                    return data ? JSON.parse(data) : null;
                } catch (e) { return null; }
            },
            saveCache: function() {
                try {
                    localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify({
                        locations: state.locations,
                        shifts: state.shifts,
                        slots: state.slots,
                        bookings: state.bookings,
                        contacts: state.contacts
                    }));
                } catch (e) {}
            },
            isAdminAuth: function() {
                try { return sessionStorage.getItem(CONFIG.ADMIN_SESSION_KEY) === 'true'; } catch (e) { return false; }
            },
            setAdminAuth: function(status) {
                try {
                    if (status) sessionStorage.setItem(CONFIG.ADMIN_SESSION_KEY, 'true');
                    else sessionStorage.removeItem(CONFIG.ADMIN_SESSION_KEY);
                } catch (e) {}
            },
            getUserAuth: function() {
                try {
                    var userStr = localStorage.getItem(CONFIG.USER_SESSION_KEY);
                    return userStr ? JSON.parse(userStr) : null;
                } catch (e) { return null; }
            },
            setUserAuth: function(user) {
                try {
                    if (user) localStorage.setItem(CONFIG.USER_SESSION_KEY, JSON.stringify(user));
                    else localStorage.removeItem(CONFIG.USER_SESSION_KEY);
                } catch (e) {}
            }
        };

        // =======================================================================
        // Synchronization Engine
        // =======================================================================
        var AppEngine = {
            init: function() {
                state.availableDates = generateNext30Days();
                state.selectedDate = state.availableDates[0];
                state.isAdmin = StorageEngine.isAdminAuth();
                state.currentUser = StorageEngine.getUserAuth();

                var cached = StorageEngine.getCache();
                if (cached && cached.locations && cached.locations.length > 0) {
                    state.locations = cached.locations;
                    state.shifts = cached.shifts || [];
                    state.slots = cached.slots || [];
                    state.bookings = cached.bookings || [];
                    state.contacts = cached.contacts || [];
                    state.dataLoaded = true;
                    renderApp();
                }

                this.syncWithDatabase();
                this.setupRealtime();
                this.setupVisibilityHandler();
            },

            syncWithDatabase: function() {
                if (!supabaseClient) {
                    state.dataLoaded = true;
                    renderApp();
                    return;
                }

                state.isSyncing = true;
                var self = this;
                var dateKey = formatDateKey(state.selectedDate);

                Promise.all([
                    supabaseClient.from('locations').select('*').eq('is_active', true).order('display_order'),
                    supabaseClient.from('shifts').select('*').eq('is_active', true),
                    supabaseClient.from('schedule_slots').select('*').eq('slot_date', dateKey),
                    supabaseClient.from('bookings').select('*').eq('status', 'CONFIRMED'),
                    supabaseClient.from('contacts').select('*')
                ]).then(function(results) {
                    if (!results[0].error && results[0].data) state.locations = results[0].data;
                    if (!results[1].error && results[1].data) state.shifts = results[1].data;
                    if (!results[2].error && results[2].data) state.slots = results[2].data;
                    if (!results[3].error && results[3].data) state.bookings = results[3].data;
                    if (!results[4].error && results[4].data) state.contacts = results[4].data;

                    state.dataLoaded = true;
                    state.isSyncing = false;
                    state.syncError = false;

                    StorageEngine.saveCache();
                    var activeTag = document.activeElement ? document.activeElement.tagName : '';
                    if (activeTag !== 'INPUT') renderApp();
                }).catch(function(err) {
                    state.isSyncing = false;
                    state.syncError = true;
                    state.dataLoaded = true;
                    renderApp();
                });
            },

            setupRealtime: function() {
                if (!supabaseClient) return;
                var self = this;
                try {
                    if (state.realtimeChannel) supabaseClient.removeChannel(state.realtimeChannel);
                    state.realtimeChannel = supabaseClient.channel('kochi-realtime-sync')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, function() { self.syncWithDatabase(); })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_slots' }, function() { self.syncWithDatabase(); })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'locations' }, function() { self.syncWithDatabase(); })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'shifts' }, function() { self.syncWithDatabase(); })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'contacts' }, function() { self.syncWithDatabase(); })
                        .subscribe();
                } catch (e) {}
            },

            setupVisibilityHandler: function() {
                var self = this;
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') {
                        self.syncWithDatabase();
                        self.setupRealtime();
                    }
                });
            }
        };

        // =======================================================================
        // User Slot Actions & Attendance Confirmations
        // =======================================================================
        window.claimYellowSlot = function(locationId, shiftId, slotType) {
            if (!state.currentUser) {
                showToast('Please log in with your phone number to claim this slot', 'error');
                return;
            }

            var name = state.currentUser.full_name;
            var phone = state.currentUser.phone;
            var dateKey = formatDateKey(state.selectedDate);
            var targetSlot = null;

            for (var i = 0; i < state.slots.length; i++) {
                if (state.slots[i].location_id === locationId && state.slots[i].shift_id === shiftId && state.slots[i].slot_date === dateKey) {
                    targetSlot = state.slots[i];
                    break;
                }
            }

            function proceedWithBooking(slotRecordId) {
                supabaseClient.rpc('claim_slot_atomic', {
                    p_slot_id: slotRecordId,
                    p_volunteer_name: name,
                    p_volunteer_phone: phone,
                    p_booking_type: slotType.toUpperCase()
                }).then(function(res) {
                    if (res.data && res.data.success) {
                        if (res.data.booking_id) {
                            supabaseClient.from('bookings').update({ is_confirmed: true }).eq('id', res.data.booking_id).then(function() {});
                        }
                        showToast('Slot claimed successfully!', 'success');
                        AppEngine.syncWithDatabase();
                    } else {
                        var msg = res.data && res.data.message ? res.data.message : 'Slot could not be confirmed';
                        showToast(msg, 'error');
                    }
                }).catch(function() { showToast('Connection issue claiming slot', 'error'); });
            }

            if (targetSlot) {
                proceedWithBooking(targetSlot.id);
            } else {
                var regCap = 2, sbyCap = 1;
                for (var j = 0; j < state.shifts.length; j++) {
                    if (state.shifts[j].id === shiftId) {
                        regCap = state.shifts[j].regular_capacity || 2;
                        sbyCap = state.shifts[j].standby_capacity || 1;
                        break;
                    }
                }
                supabaseClient.from('schedule_slots').insert([{
                    location_id: locationId,
                    shift_id: shiftId,
                    slot_date: dateKey,
                    max_regular: regCap,
                    max_standby: sbyCap
                }]).select().single().then(function(res) {
                    if (res.data) {
                        state.slots.push(res.data);
                        proceedWithBooking(res.data.id);
                    } else {
                        showToast('Failed to initialize shift slot', 'error');
                    }
                });
            }
        };

        window.toggleAttendanceConfirmation = function(bookingId, currentConfirmedState) {
            var newState = !currentConfirmedState;
            supabaseClient.from('bookings').update({ is_confirmed: newState }).eq('id', bookingId).then(function(res) {
                if (!res.error) {
                    showToast(newState ? 'Attendance confirmed! (Slot is Green)' : 'Attendance unmarked', 'success');
                    AppEngine.syncWithDatabase();
                } else {
                    showToast('Error updating confirmation', 'error');
                }
            });
        };

        window.adminRemoveVolunteer = function(bookingId, slotId, bookingType) {
            if (!confirm('Remove this volunteer from the schedule? The slot will turn Yellow for replacements.')) return;

            supabaseClient.from('bookings').delete().eq('id', bookingId).then(function(res) {
                if (!res.error) {
                    var targetSlot = null;
                    for (var s = 0; s < state.slots.length; s++) {
                        if (state.slots[s].id === slotId) { targetSlot = state.slots[s]; break; }
                    }
                    if (targetSlot) {
                        var updatePayload = {};
                        if (bookingType === 'REGULAR') {
                            updatePayload.booked_regular = Math.max(0, targetSlot.booked_regular - 1);
                        } else {
                            updatePayload.booked_standby = Math.max(0, targetSlot.booked_standby - 1);
                        }
                        supabaseClient.from('schedule_slots').update(updatePayload).eq('id', slotId).then(function() {});
                    }
                    showToast('Volunteer removed. Slot is now Yellow (Open).', 'success');
                    AppEngine.syncWithDatabase();
                } else {
                    showToast('Error removing volunteer', 'error');
                }
            });
        };

        // =======================================================================
        // Excel Contact List Importer (Allowlist)
        // =======================================================================
        window.triggerExcelContactUpload = function() {
            document.getElementById('excel_contact_input').click();
        };

        window.handleExcelContactUpload = function(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = window.XLSX.read(data, { type: 'array' });
                    var firstSheet = workbook.SheetNames[0];
                    var rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                    
                    var newContacts = [];
                    for (var i = 0; i < rows.length; i++) {
                        var row = rows[i];
                        var phone = row['Phone'] || row['Phone Number'] || row['Contact'] || row['phone'] || row['Mobile'];
                        var name = row['Name'] || row['Full Name'] || row['Volunteer Name'] || row['name'] || row['Volunteer'];
                        
                        if (phone && name) {
                            var cleanPhone = String(phone).replace(/\D/g, '');
                            if (cleanPhone.length > 5) {
                                newContacts.push({ phone: cleanPhone, full_name: String(name).trim() });
                            }
                        }
                    }

                    if (newContacts.length === 0) {
                        showToast('No valid rows found. Ensure "Name" and "Phone" columns exist.', 'error');
                        return;
                    }

                    supabaseClient.from('contacts').upsert(newContacts).then(function(res) {
                        if (!res.error) {
                            showToast('Successfully updated ' + newContacts.length + ' authorized contacts!', 'success');
                            AppEngine.syncWithDatabase();
                        } else {
                            showToast('Database error importing contacts', 'error');
                        }
                    });
                } catch (err) {
                    showToast('Failed to parse Excel file', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // =======================================================================
        // 1-Click WhatsApp Automations
        // =======================================================================
        window.sendSingleWhatsAppReminder = function(phone, volunteerName, locationName, shiftName) {
            var dateStr = formatDisplayDate(state.selectedDate);
            var message = "Hello " + volunteerName + ",\n\nThis is a reminder for your upcoming duty assignment for SMPW Kochi:\n\n📍 Location: " + locationName + "\n📅 Date: " + dateStr + "\n⏰ Shift: " + shiftName + "\n\nPlease open the scheduling portal and tap the checkmark to confirm your attendance.\nThank you!";
            var cleanPhone = String(phone).replace(/\D/g, '');
            if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;
            
            var waLink = "https://wa.me/" + cleanPhone + "?text=" + encodeURIComponent(message);
            window.open(waLink, '_blank');
        };

        window.sendAllWhatsAppRemindersBatch = function() {
            var activeDateKey = formatDateKey(state.selectedDate);
            var activeBookings = [];

            for (var b = 0; b < state.bookings.length; b++) {
                var bSlotId = state.bookings[b].slot_id;
                for (var s = 0; s < state.slots.length; s++) {
                    if (state.slots[s].id === bSlotId && state.slots[s].slot_date === activeDateKey) {
                        activeBookings.push({
                            booking: state.bookings[b],
                            slot: state.slots[s]
                        });
                        break;
                    }
                }
            }

            if (activeBookings.length === 0) {
                showToast('No assigned volunteers to remind for this date.', 'error');
                return;
            }

            var unconfirmedCount = 0;
            for (var i = 0; i < activeBookings.length; i++) {
                var item = activeBookings[i];
                if (!item.booking.is_confirmed) {
                    unconfirmedCount++;
                    var locName = 'Duty Station';
                    for (var l = 0; l < state.locations.length; l++) {
                        if (state.locations[l].id === item.slot.location_id) { locName = state.locations[l].name; break; }
                    }
                    var shiftName = 'Scheduled Timing';
                    for (var sh = 0; sh < state.shifts.length; sh++) {
                        if (state.shifts[sh].id === item.slot.shift_id) { shiftName = state.shifts[sh].shift_name; break; }
                    }
                    
                    window.sendSingleWhatsAppReminder(item.booking.volunteer_phone, item.booking.volunteer_name, locName, shiftName);
                }
            }

            if (unconfirmedCount === 0) {
                showToast('All volunteers for this date have already confirmed attendance!', 'success');
            } else {
                showToast('Opening ' + unconfirmedCount + ' WhatsApp reminder chats...', 'success');
            }
        };

        window.copyWhatsAppGroupBroadcast = function() {
            var activeDateKey = formatDateKey(state.selectedDate);
            var text = "📋 *SMPW KOCHI DUTY ROSTER*\n📅 *" + formatDisplayDate(state.selectedDate) + "*\n━━━━━━━━━━━━━━━━━━━━\n\n";

            for (var l = 0; l < state.locations.length; l++) {
                var loc = state.locations[l];
                var locShifts = state.shifts.filter(function(s) { return s.location_id === loc.id; });
                if (locShifts.length > 0) {
                    text += "📍 *" + loc.name.toUpperCase() + "*\n";
                    for (var s = 0; s < locShifts.length; s++) {
                        var shift = locShifts[s];
                        var slot = null;
                        for (var sl = 0; sl < state.slots.length; sl++) {
                            if (state.slots[sl].shift_id === shift.id && state.slots[sl].slot_date === activeDateKey) {
                                slot = state.slots[sl]; break;
                            }
                        }
                        text += "⏰ " + shift.shift_name + ":\n";
                        var bks = [];
                        if (slot) {
                            for (var b = 0; b < state.bookings.length; b++) {
                                if (state.bookings[b].slot_id === slot.id) bks.push(state.bookings[b]);
                            }
                        }
                        if (bks.length === 0) {
                            text += "   ⚠️ _[OPEN SLOTS AVAILABLE]_\n";
                        } else {
                            for (var k = 0; k < bks.length; k++) {
                                var badge = bks[k].is_confirmed ? "✅" : "⏳";
                                text += "   • " + bks[k].volunteer_name + " (" + bks[k].booking_type + ") " + badge + "\n";
                            }
                        }
                    }
                    text += "\n";
                }
            }

            text += "🔗 *Confirm or Claim Slots Online:* " + window.location.href;

            navigator.clipboard.writeText(text).then(function() {
                showToast('Roster summary copied! Paste directly into WhatsApp.', 'success');
            }).catch(function() {
                showToast('Unable to access clipboard', 'error');
            });
        };

        // =======================================================================
        // Authentication Handlers
        // =======================================================================
        window.handleUserLogin = function(e) {
            e.preventDefault();
            var phoneInput = document.getElementById('user_phone_login');
            var rawPhone = phoneInput ? phoneInput.value.trim() : '';
            var cleanPhone = rawPhone.replace(/\D/g, '');

            if (!cleanPhone) {
                showToast('Please enter a valid phone number', 'error');
                return;
            }

            supabaseClient.from('contacts').select('*').then(function(res) {
                var list = res.data || [];
                var matched = null;
                for (var i = 0; i < list.length; i++) {
                    var storedClean = String(list[i].phone).replace(/\D/g, '');
                    if (storedClean === cleanPhone || storedClean.indexOf(cleanPhone) !== -1 || cleanPhone.indexOf(storedClean) !== -1) {
                        matched = list[i];
                        break;
                    }
                }

                if (matched) {
                    state.currentUser = { phone: matched.phone, full_name: matched.full_name };
                    StorageEngine.setUserAuth(state.currentUser);
                    showToast('Welcome, ' + matched.full_name + '!', 'success');
                    renderApp();
                } else {
                    showToast('Phone number not found in authorized roster. Contact Overseer.', 'error');
                }
            }).catch(function() { showToast('Authentication check error', 'error'); });
        };

        window.logoutUser = function() {
            state.currentUser = null;
            StorageEngine.setUserAuth(null);
            renderApp();
        };

        window.selectDate = function(isoString) {
            state.selectedDate = new Date(isoString);
            AppEngine.syncWithDatabase();
        };

        window.toggleAdminModal = function(show) {
            state.showAdminLogin = show;
            state.loginError = false;
            renderApp();
        };

        window.handleAdminAuth = function(e) {
            e.preventDefault();
            var pwd = document.getElementById('admin_pwd').value.trim();
            if (!pwd) return;

            sha256(pwd).then(function(hash) {
                supabaseClient.from('system_config').select('value_hash').eq('key', 'admin_pin_hash').single().then(function(res) {
                    var validHash = res.data ? res.data.value_hash : '';
                    if (validHash === hash || pwd === CONFIG.FALLBACK_PIN) {
                        state.isAdmin = true;
                        state.showAdminLogin = false;
                        state.loginError = false;
                        StorageEngine.setAdminAuth(true);
                        showToast('Admin clearance granted', 'success');
                    } else {
                        state.loginError = true;
                    }
                    renderApp();
                }).catch(function() {
                    if (pwd === CONFIG.FALLBACK_PIN) {
                        state.isAdmin = true;
                        state.showAdminLogin = false;
                        state.loginError = false;
                        StorageEngine.setAdminAuth(true);
                    } else {
                        state.loginError = true;
                    }
                    renderApp();
                });
            });
        };

        window.logoutAdmin = function() {
            state.isAdmin = false;
            state.editingLocationId = null;
            StorageEngine.setAdminAuth(false);
            showToast('Admin session locked', 'info');
            renderApp();
        };

        // =======================================================================
        // Dynamic Slot Capacity Modification (Admin)
        // =======================================================================
        window.updateShiftSlots = function(locationId, shiftId, type, change) {
            var targetShift = null;
            for (var i = 0; i < state.shifts.length; i++) {
                if (state.shifts[i].id === shiftId) { targetShift = state.shifts[i]; break; }
            }
            if (!targetShift) return;

            var currentVal = type === 'slotsCount' ? (targetShift.regular_capacity || 2) : (targetShift.standby_capacity || 1);
            var newVal = Math.max(0, currentVal + change);

            if (type === 'slotsCount') targetShift.regular_capacity = newVal;
            else targetShift.standby_capacity = newVal;

            var dateKey = formatDateKey(state.selectedDate);
            var targetSlot = null;
            for (var k = 0; k < state.slots.length; k++) {
                if (state.slots[k].shift_id === shiftId && state.slots[k].slot_date === dateKey) { targetSlot = state.slots[k]; break; }
            }

            if (targetSlot) {
                if (type === 'slotsCount') targetSlot.max_regular = newVal;
                else targetSlot.max_standby = newVal;
            }

            renderApp(); 

            var shiftPayload = {};
            if (type === 'slotsCount') shiftPayload.regular_capacity = newVal;
            else shiftPayload.standby_capacity = newVal;
            supabaseClient.from('shifts').update(shiftPayload).eq('id', shiftId).then(function() {});

            if (targetSlot) {
                var slotPayload = {};
                if (type === 'slotsCount') slotPayload.max_regular = newVal;
                else slotPayload.max_standby = newVal;
                supabaseClient.from('schedule_slots').update(slotPayload).eq('id', targetSlot.id).then(function() { AppEngine.syncWithDatabase(); });
            } else {
                supabaseClient.from('schedule_slots').insert([{
                    location_id: locationId, shift_id: shiftId, slot_date: dateKey, max_regular: targetShift.regular_capacity, max_standby: targetShift.standby_capacity
                }]).then(function() { AppEngine.syncWithDatabase(); });
            }

                                            '</div>' +
                                            '<div class="flex items-center gap-1.5">' +
                                                '<button onclick="sendSingleWhatsAppReminder(\'' + escapeHtml(assigned.volunteer_phone) + '\', \'' + escapeHtml(assigned.volunteer_name) + '\', \'' + escapeHtml(loc.name) + '\', \'' + escapeHtml(shift.shift_name) + '\')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg flex items-center gap-1"><i class="fa-brands fa-whatsapp"></i> Remind</button>' +
                                                '<button onclick="adminRemoveVolunteer(\'' + assigned.id + '\', \'' + (currentSlot ? currentSlot.id : '') + '\', \'' + typeStr + '\')" class="text-slate-400 hover:text-red-400 bg-slate-900/60 p-1.5 rounded-lg" title="Remove name (Turns Yellow)"><i class="fa-solid fa-trash-can"></i></button>' +
                                            '</div></div>';
                                    } else if (isMine) {
                                        var isConf = assigned.is_confirmed;
                                        slotHtml += '<div class="flex items-center justify-between ' + (isConf ? 'bg-emerald-500/20 border-emerald-500/40' : 'bg-indigo-500/20 border-indigo-500/40') + ' border rounded-xl px-4 py-3 shadow-lg">' +
                                            '<div class="flex items-center gap-3">' +
                                                '<div class="w-7 h-7 rounded-full ' + (isConf ? 'bg-emerald-500 text-slate-950' : 'bg-indigo-600 text-white') + ' flex items-center justify-center">' +
                                                    '<i class="fa-solid ' + (isConf ? 'fa-check' : 'fa-clock') + ' text-sm"></i>' +
                                                '</div>' +
                                                '<div>' +
                                                    '<span class="font-bold text-white text-sm">' + escapeHtml(assigned.volunteer_name) + ' (You)</span>' +
                                                    '<p class="text-[10px] ' + (isConf ? 'text-emerald-300 font-bold' : 'text-indigo-300') + '">' + (isConf ? '✓ Attendance Confirmed' : 'Please check box to confirm attendance') + '</p>' +
                                                '</div>' +
                                            '</div>' +
                                            '<button onclick="toggleAttendanceConfirmation(\'' + assigned.id + '\', ' + isConf + ')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 ' + (isConf ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-800 text-slate-300 border border-white/10 hover:bg-slate-700') + '">' +
                                                '<i class="fa-solid ' + (isConf ? 'fa-circle-check' : 'fa-circle') + '"></i> ' + (isConf ? 'Confirmed' : 'Confirm') +
                                            '</button>' +
                                        '</div>';
                                    } else {
                                        slotHtml += '<div class="flex items-center gap-3 bg-slate-800/40 border border-white/5 rounded-xl px-4 py-2.5 opacity-50">' +
                                            '<div class="w-5 h-5 rounded-full bg-slate-700 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-lock text-[10px]"></i></div>' +
                                            '<span class="font-semibold text-slate-400 text-xs sm:text-sm">Assigned Slot (Filled)</span>' +
                                        '</div>';
                                    }
                                } else {
                                    if (state.isAdmin) {
                                        slotHtml += '<div class="flex items-center gap-3 bg-amber-500/10 border border-amber-500/30 rounded-xl px-4 py-2.5 opacity-80">' +
                                            '<div class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center"><i class="fa-solid fa-user-plus text-xs"></i></div>' +
                                            '<span class="font-bold text-amber-200 text-xs sm:text-sm">Open ' + (typeStr === 'REGULAR' ? 'Regular' : 'Standby') + ' Slot (Yellow)</span>' +
                                        '</div>';
                                    } else {
                                        slotHtml += '<div onclick="claimYellowSlot(\'' + loc.id + '\', \'' + shift.id + '\', \'' + typeStr + '\')" class="cursor-pointer bg-amber-500/20 hover:bg-amber-500/30 border-2 border-dashed border-amber-400/60 rounded-xl px-4 py-3 transition-all flex justify-between items-center shadow-[0_0_15px_rgba(245,158,11,0.15)] active:scale-[0.98]">' +
                                            '<div class="flex items-center gap-3">' +
                                                '<div class="w-7 h-7 rounded-full bg-amber-500 text-amber-950 flex items-center justify-center font-bold shadow-md">' +
                                                    '<i class="fa-solid fa-plus text-xs"></i>' +
                                                '</div>' +
                                                '<div>' +
                                                    '<span class="font-bold text-amber-100 text-sm">Available Duty - Tap to Claim</span>' +
                                                    '<p class="text-[10px] text-amber-300/80">Slot vacated. Put your name here.</p>' +
                                                '</div>' +
                                            '</div>' +
                                            '<span class="text-xs font-bold text-amber-300 bg-amber-950/60 px-2.5 py-1 rounded-lg border border-amber-500/30">Claim Slot</span>' +
                                        '</div>';
                                    }
                                }
                            }
                            slotHtml += '</div>';
                            return slotHtml;
                        }

                        if (regCap > 0) html += renderSlots(regCap, regBookings, 'REGULAR', 'fa-users', 'indigo');
                        if (sbyCap > 0) {
                            html += '<div class="mt-3 pt-4 border-t border-white/5 relative"><span class="absolute -top-2.5 left-4 bg-slate-900 px-2 text-[10px] font-bold uppercase text-amber-500/80"><i class="fa-solid fa-user-shield"></i> Standby Reserve</span>';
                            html += renderSlots(sbyCap, sbyBookings, 'STANDBY', 'fa-user-shield', 'amber');
                            html += '</div>';
                        }
                        html += '</div>';
                    }
                }
                html += '</div></div>';
            }

            if (state.isAdmin) {
                html += '<div class="bg-indigo-950/20 border border-indigo-500/30 rounded-3xl p-5"><h3 class="text-lg font-bold text-indigo-300 mb-4"><i class="fa-solid fa-plus"></i> Add Duty Station</h3><form onsubmit="addLocation(event)" class="space-y-3"><input id="new_loc_name" required placeholder="Station Name (e.g. Marine Drive Center)" class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm" /><input id="new_loc_map" placeholder="Google Maps Link URL or Address" class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm" /><button type="submit" class="w-full bg-indigo-600 text-white px-4 py-3 rounded-xl text-sm font-bold mt-2">Create Station</button></form></div>';
            }

            html += '</div></main>';
            html += '</div>';
            root.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() { AppEngine.init(); });
    </script>
</body>
</html>
