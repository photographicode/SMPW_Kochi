<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMPW Kochi Scheduler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .touch-manipulation { touch-action: manipulation; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950/40 text-slate-200 font-sans selection:bg-indigo-500/30 antialiased min-h-screen touch-manipulation">

    <div id="app-root">
        <div class="min-h-screen flex flex-col items-center justify-center text-slate-400 gap-4">
            <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            Connecting to SMPW Kochi Database...
        </div>
    </div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 max-w-sm w-full px-4 pointer-events-none"></div>

    <script>
        // =======================================================================
        // Configuration & Supabase Initialization
        // =======================================================================
        var CONFIG = {
            SUPABASE_URL: 'https://vffbprsuvrwkzvwnipvg.supabase.co',
            SUPABASE_ANON_KEY: 'sb_publishable_a2RUr35OTMoqN4FRA3aTgg_1kHxmFp1',
            LOCAL_STORAGE_KEY: 'smpw_kochi_cache_v2',
            ADMIN_SESSION_KEY: 'smpw_admin_auth_v2',
            FALLBACK_PIN: '9847'
        };

        var supabaseClient = null;
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        }

        // =======================================================================
        // App State
        // =======================================================================
        var state = {
            dataLoaded: false,
            isSyncing: false,
            syncError: false,
            locations: [],
            shifts: [],
            slots: [],
            bookings: [],
            availableDates: [],
            selectedDate: null,
            isAdmin: false,
            showAdminLogin: false,
            loginError: false,
            editingLocationId: null,
            realtimeChannel: null
        };

        // =======================================================================
        // Date & Helper Utilities (Legacy Compatible - No Breaking ?. Syntax)
        // =======================================================================
        function generateNext30Days() {
            var dates = [];
            var today = new Date();
            for (var i = 0; i < 30; i++) {
                var nextDate = new Date(today);
                nextDate.setDate(today.getDate() + i);
                dates.push(nextDate);
            }
            return dates;
        }

        function formatDateKey(dateObj) {
            var d = dateObj ? dateObj : new Date();
            return d.toISOString().split('T')[0];
        }

        function formatDisplayDate(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        }

        function formatShortDate(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function formatMonth(dateObj) {
            if (!dateObj) return '';
            return dateObj.toLocaleDateString('en-US', { month: 'short' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sha256(str) {
            var buffer = new TextEncoder('utf-8').encode(str);
            return crypto.subtle.digest('SHA-256', buffer).then(function(hashBuffer) {
                var hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) {
                    return ('00' + b.toString(16)).slice(-2);
                }).join('');
            });
        }

        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) return;

            var toast = document.createElement('div');
            var bgStyle = 'bg-slate-900 border-white/10 text-white';
            if (type === 'error') bgStyle = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
            if (type === 'success') bgStyle = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';

            toast.className = 'pointer-events-auto p-3.5 rounded-2xl border shadow-2xl text-xs font-semibold flex items-center justify-between transition-all duration-300 ' + bgStyle;
            toast.innerHTML = '<span>' + escapeHtml(message) + '</span>';
            container.appendChild(toast);

            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3500);
        }

        // =======================================================================
        // Local Cache & Persistence
        // =======================================================================
        var StorageEngine = {
            getCache: function() {
                try {
                    var data = localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY);
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    return null;
                }
            },
            saveCache: function() {
                try {
                    localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify({
                        locations: state.locations,
                        shifts: state.shifts,
                        slots: state.slots,
                        bookings: state.bookings
                    }));
                } catch (e) {}
            },
            isAdminAuth: function() {
                try {
                    return sessionStorage.getItem(CONFIG.ADMIN_SESSION_KEY) === 'true';
                } catch (e) {
                    return false;
                }
            },
            setAdminAuth: function(status) {
                try {
                    if (status) {
                        sessionStorage.setItem(CONFIG.ADMIN_SESSION_KEY, 'true');
                    } else {
                        sessionStorage.removeItem(CONFIG.ADMIN_SESSION_KEY);
                    }
                } catch (e) {}
            }
        };

        // =======================================================================
        // Database Synchronization Engine (Supabase Realtime)
        // =======================================================================
        var AppEngine = {
            init: function() {
                state.availableDates = generateNext30Days();
                state.selectedDate = state.availableDates[0];
                state.isAdmin = StorageEngine.isAdminAuth();

                // Hydrate from localStorage for zero-lag instant rendering
                var cached = StorageEngine.getCache();
                if (cached && cached.locations && cached.locations.length > 0) {
                    state.locations = cached.locations;
                    state.shifts = cached.shifts || [];
                    state.slots = cached.slots || [];
                    state.bookings = cached.bookings || [];
                    state.dataLoaded = true;
                    renderApp();
                }

                this.syncWithDatabase();
                this.setupRealtime();
                this.setupVisibilityHandler();
            },

            syncWithDatabase: function() {
                if (!supabaseClient) {
                    state.dataLoaded = true;
                    renderApp();
                    return;
                }

                state.isSyncing = true;
                var self = this;
                var dateKey = formatDateKey(state.selectedDate);

                Promise.all([
                    supabaseClient.from('locations').select('*').eq('is_active', true).order('display_order'),
                    supabaseClient.from('shifts').select('*').eq('is_active', true),
                    supabaseClient.from('schedule_slots').select('*').eq('slot_date', dateKey),
                    supabaseClient.from('bookings').select('*').eq('status', 'CONFIRMED')
                ]).then(function(results) {
                    var locRes = results[0];
                    var shiftRes = results[1];
                    var slotRes = results[2];
                    var bookRes = results[3];

                    if (!locRes.error && locRes.data) state.locations = locRes.data;
                    if (!shiftRes.error && shiftRes.data) state.shifts = shiftRes.data;
                    if (!slotRes.error && slotRes.data) state.slots = slotRes.data;
                    if (!bookRes.error && bookRes.data) state.bookings = bookRes.data;

                    state.dataLoaded = true;
                    state.isSyncing = false;
                    state.syncError = false;

                    StorageEngine.saveCache();

                    // Prevent re-rendering over an input field if user is actively typing
                    var activeTag = document.activeElement ? document.activeElement.tagName : '';
                    if (activeTag !== 'INPUT') {
                        renderApp();
                    }
                }).catch(function(err) {
                    console.error('Sync failure:', err);
                    state.isSyncing = false;
                    state.syncError = true;
                    state.dataLoaded = true;
                    renderApp();
                });
            },

            setupRealtime: function() {
                if (!supabaseClient) return;
                var self = this;

                try {
                    if (state.realtimeChannel) {
                        supabaseClient.removeChannel(state.realtimeChannel);
                    }

                    state.realtimeChannel = supabaseClient.channel('kochi-realtime-sync')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, function() {
                            self.syncWithDatabase();
                        })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_slots' }, function() {
                            self.syncWithDatabase();
                        })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'locations' }, function() {
                            self.syncWithDatabase();
                        })
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'shifts' }, function() {
                            self.syncWithDatabase();
                        })
                        .subscribe();
                } catch (e) {}
            },

            setupVisibilityHandler: function() {
                var self = this;
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') {
                        self.syncWithDatabase();
                        self.setupRealtime();
                    }
                });
            }
        };

        // =======================================================================
        // User Slot Actions (Save & Clear)
        // =======================================================================
        window.saveSlot = function(locationId, shiftId, slotType, slotIndex) {
            var inputId = 'input_' + locationId + '_' + shiftId + '_' + slotType + '_' + slotIndex;
            var inputEl = document.getElementById(inputId);
            var name = inputEl ? inputEl.value.trim() : '';

            if (!name) {
                showToast('Please type your name first', 'error');
                return;
            }

            var dateKey = formatDateKey(state.selectedDate);
            var targetSlot = null;

            for (var i = 0; i < state.slots.length; i++) {
                if (state.slots[i].location_id === locationId && state.slots[i].shift_id === shiftId && state.slots[i].slot_date === dateKey) {
                    targetSlot = state.slots[i];
                    break;
                }
            }

            function proceedWithBooking(slotRecordId) {
                supabaseClient.rpc('claim_slot_atomic', {
                    p_slot_id: slotRecordId,
                    p_volunteer_name: name,
                    p_volunteer_phone: 'Registered Online',
                    p_booking_type: slotType.toUpperCase()
                }).then(function(res) {
                    if (res.data && res.data.success) {
                        showToast('Slot reserved successfully!', 'success');
                        AppEngine.syncWithDatabase();
                    } else {
                        var msg = res.data && res.data.message ? res.data.message : 'Slot could not be confirmed';
                        showToast(msg, 'error');
                    }
                }).catch(function() {
                    showToast('Connection issue reserving slot', 'error');
                });
            }

            if (targetSlot) {
                proceedWithBooking(targetSlot.id);
            } else {
                // Find template capacities
                var regCap = 2, sbyCap = 1;
                for (var j = 0; j < state.shifts.length; j++) {
                    if (state.shifts[j].id === shiftId) {
                        regCap = state.shifts[j].regular_capacity || 2;
                        sbyCap = state.shifts[j].standby_capacity || 1;
                        break;
                    }
                }

                supabaseClient.from('schedule_slots').insert([{
                    location_id: locationId,
                    shift_id: shiftId,
                    slot_date: dateKey,
                    max_regular: regCap,
                    max_standby: sbyCap
                }]).select().single().then(function(res) {
                    if (res.data) {
                        state.slots.push(res.data);
                        proceedWithBooking(res.data.id);
                    } else {
                        showToast('Failed to initialize shift slot', 'error');
                    }
                });
            }
        };

        window.clearBooking = function(bookingId) {
            if (!state.isAdmin) return;
            if (!confirm('Remove this volunteer registration?')) return;

            supabaseClient.from('bookings').delete().eq('id', bookingId).then(function(res) {
                if (!res.error) {
                    showToast('Volunteer removed', 'success');
                    AppEngine.syncWithDatabase();
                } else {
                    showToast('Error removing booking', 'error');
                }
            });
        };

        // =======================================================================
        // UI & Admin Event Handlers
        // =======================================================================
        window.selectDate = function(isoString) {
            state.selectedDate = new Date(isoString);
            AppEngine.syncWithDatabase();
        };

        window.toggleAdminModal = function(show) {
            state.showAdminLogin = show;
            state.loginError = false;
            renderApp();
        };

        window.handleAdminAuth = function(e) {
            e.preventDefault();
            var pwd = document.getElementById('admin_pwd').value.trim();
            if (!pwd) return;

            sha256(pwd).then(function(hash) {
                supabaseClient.from('system_config').select('value_hash').eq('key', 'admin_pin_hash').single().then(function(res) {
                    var validHash = res.data ? res.data.value_hash : '';
                    if (validHash === hash || pwd === CONFIG.FALLBACK_PIN) {
                        state.isAdmin = true;
                        state.showAdminLogin = false;
                        state.loginError = false;
                        StorageEngine.setAdminAuth(true);
                        showToast('Admin clearance granted', 'success');
                    } else {
                        state.loginError = true;
                    }
                    renderApp();
                }).catch(function() {
                    if (pwd === CONFIG.FALLBACK_PIN) {
                        state.isAdmin = true;
                        state.showAdminLogin = false;
                        state.loginError = false;
                        StorageEngine.setAdminAuth(true);
                    } else {
                        state.loginError = true;
                    }
                    renderApp();
                });
            });
        };

        window.logoutAdmin = function() {
            state.isAdmin = false;
            state.editingLocationId = null;
            StorageEngine.setAdminAuth(false);
            showToast('Admin session locked', 'info');
            renderApp();
        };

        window.addLocation = function(e) {
            e.preventDefault();
            var name = document.getElementById('new_loc_name').value.trim();
            var mapUrl = document.getElementById('new_loc_map').value.trim();
            var phone = document.getElementById('new_loc_phone').value.trim();
            if (!name) return;

            var fullAddress = mapUrl;
            if (phone) fullAddress = (fullAddress ? fullAddress + ' | ' : '') + 'Tel: ' + phone;

            supabaseClient.from('locations').insert([{
                name: name,
                address: fullAddress,
                is_active: true
            }]).then(function(res) {
                if (!res.error) {
                    showToast('Duty station created', 'success');
                    AppEngine.syncWithDatabase();
                } else {
                    showToast('Error: ' + res.error.message, 'error');
                }
            });
        };

        window.deleteLocation = function(id) {
            if (!confirm('Are you sure you want to delete this entire location?')) return;
            supabaseClient.from('locations').delete().eq('id', id).then(function() {
                showToast('Location deleted', 'info');
                AppEngine.syncWithDatabase();
            });
        };

        window.setEditingLocation = function(id) {
            state.editingLocationId = id;
            renderApp();
        };

        window.saveEditLocation = function(id) {
            var name = document.getElementById('edit_name_' + id).value.trim();
            var mapUrl = document.getElementById('edit_map_' + id).value.trim();
            var phone = document.getElementById('edit_phone_' + id).value.trim();

            if (!name) return;
            var fullAddress = mapUrl;
            if (phone) fullAddress = (fullAddress ? fullAddress + ' | ' : '') + 'Tel: ' + phone;

            supabaseClient.from('locations').update({
                name: name,
                address: fullAddress
            }).eq('id', id).then(function() {
                state.editingLocationId = null;
                showToast('Location updated', 'success');
                AppEngine.syncWithDatabase();
            });
        };

        window.addShift = function(locId) {
            var labelEl = document.getElementById('new_shift_' + locId);
            var label = labelEl ? labelEl.value.trim() : '';
            if (!label) return;

            supabaseClient.from('shifts').insert([{
                location_id: locId,
                shift_name: label,
                start_time: '08:00:00',
                end_time: '12:00:00',
                regular_capacity: 2,
                standby_capacity: 1,
                is_active: true
            }]).then(function(res) {
                if (!res.error) {
                    showToast('Shift template created', 'success');
                    AppEngine.syncWithDatabase();
                } else {
                    showToast('Error adding shift', 'error');
                }
            });
        };

        window.updateShiftSlots = function(locId, shiftId, type, change) {
            var targetShift = null;
            for (var i = 0; i < state.shifts.length; i++) {
                if (state.shifts[i].id === shiftId) {
                    targetShift = state.shifts[i];
                    break;
                }
            }
            if (!targetShift) return;

            var currentVal = type === 'slotsCount' ? (targetShift.regular_capacity || 2) : (targetShift.standby_capacity || 1);
            var newVal = Math.max(0, currentVal + change);

            var updatePayload = {};
            if (type === 'slotsCount') updatePayload.regular_capacity = newVal;
            else updatePayload.standby_capacity = newVal;

            supabaseClient.from('shifts').update(updatePayload).eq('id', shiftId).then(function() {
                AppEngine.syncWithDatabase();
            });
        };

        window.deleteShift = function(shiftId) {
            if (!confirm('Delete this duty shift timing?')) return;
            supabaseClient.from('shifts').delete().eq('id', shiftId).then(function() {
                showToast('Shift removed', 'info');
                AppEngine.syncWithDatabase();
            });
        };

        // =======================================================================
        // Master Render Engine (Matching Your Interface Exactly)
        // =======================================================================
        function renderApp() {
            var root = document.getElementById('app-root');
            if (!state.dataLoaded || !state.selectedDate) return;

            var activeDateKey = formatDateKey(state.selectedDate);

            // Calculate total bookings for selected date
            var activeDayCount = 0;
            for (var b = 0; b < state.bookings.length; b++) {
                var bSlotId = state.bookings[b].slot_id;
                for (var s = 0; s < state.slots.length; s++) {
                    if (state.slots[s].id === bSlotId && state.slots[s].slot_date === activeDateKey) {
                        activeDayCount++;
                        break;
                    }
                }
            }

            var html = '<div class="min-h-screen pb-16">';

            // Header
            html += '<header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-xl border-b border-white/10 shadow-lg">' +
                '<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex justify-between items-center">' +
                    '<div class="flex items-center gap-2 sm:gap-3">' +
                        '<div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-600/20 text-white relative">' +
                            '<i class="fa-solid fa-calendar text-lg sm:text-xl"></i>' +
                            (!state.syncError ? '<div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></div>' : '') +
                        '</div>' +
                        '<div>' +
                            '<h1 class="text-lg sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-indigo-200 tracking-tight">' +
                                'SMPW Kochi' +
                            '</h1>' +
                        '</div>' +
                    '</div>' +
                    '<button onclick="' + (state.isAdmin ? 'logoutAdmin()' : 'toggleAdminModal(true)') + '" ' +
                        'class="flex items-center gap-1.5 sm:gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm border ' +
                        (state.isAdmin ? 'bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-slate-800/80 hover:bg-slate-700 border-white/5 text-slate-400') + '">' +
                        '<i class="fa-solid ' + (state.isAdmin ? 'fa-lock-open' : 'fa-lock') + '"></i>' +
                        '<span class="hidden sm:inline">' + (state.isAdmin ? 'Admin Active' : 'Admin Login') + '</span>' +
                    '</button>' +
                '</div>' +
            '</header>';

            html += '<main class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-6">';

            // 30-Day Date Carousel
            html += '<div class="mb-6">' +
                '<div class="flex overflow-x-auto hide-scrollbar gap-2 sm:gap-3 pb-3 scroll-smooth">';

            for (var d = 0; d < state.availableDates.length; d++) {
                var dateItem = state.availableDates[d];
                var dKey = formatDateKey(dateItem);
                var isSelected = dKey === activeDateKey;
                var isToday = dKey === formatDateKey(new Date());

                html += '<button onclick="selectDate(\'' + dateItem.toISOString() + '\')" ' +
                    'class="flex-shrink-0 flex flex-col items-center justify-center w-16 sm:w-20 h-20 sm:h-24 rounded-2xl transition-all duration-300 border ' +
                    (isSelected ? 'border-indigo-500 bg-indigo-600 shadow-lg shadow-indigo-900/40 text-white transform scale-105' : 'border-white/10 bg-slate-900/50 hover:bg-slate-800 text-slate-400 backdrop-blur-sm') + '">' +
                    '<span class="text-[10px] sm:text-[11px] font-bold tracking-wider uppercase ' + (isSelected ? 'text-indigo-200' : 'text-slate-500') + '">' +
                        (isToday ? 'Today' : formatShortDate(dateItem)) +
                    '</span>' +
                    '<span class="text-xl sm:text-2xl font-bold my-0.5 sm:my-1 ' + (isSelected ? 'text-white' : 'text-slate-200') + '">' +
                        dateItem.getDate() +
                    '</span>' +
                    '<span class="text-[10px] sm:text-[11px] font-medium ' + (isSelected ? 'text-indigo-200' : 'text-slate-500') + '">' +
                        formatMonth(dateItem) +
                    '</span>' +
                '</button>';
            }

            html += '</div></div>';

            // Selected Date Title
            html += '<div class="flex flex-col mb-4 sm:mb-6 mt-2 border-b border-white/10 pb-3 sm:pb-4 px-2 sm:px-0">' +
                '<h2 class="text-xl sm:text-3xl font-bold text-white tracking-tight">' +
                    formatDisplayDate(state.selectedDate) +
                '</h2>' +
                '<p class="text-indigo-300/80 mt-1 text-xs sm:text-sm flex items-center gap-1.5 sm:gap-2">' +
                    '<span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-indigo-500 animate-pulse"></span>' +
                    activeDayCount + ' assignments active today' +
                '</p>' +
            '</div>';

            // Locations Grid
            html += '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">';

            if (state.locations.length === 0) {
                html += '<div class="col-span-full p-8 text-center bg-slate-900/60 rounded-3xl border border-white/10 text-slate-400">' +
                    '<i class="fa-solid fa-location-dot text-2xl mb-2 text-indigo-400"></i>' +
                    '<p class="text-sm font-semibold">No duty stations configured yet.</p>' +
                    (state.isAdmin ? '<p class="text-xs text-slate-500 mt-1">Use the "Add New Location" panel below to get started.</p>' : '') +
                '</div>';
            }

            for (var l = 0; l < state.locations.length; l++) {
                var loc = state.locations[l];
                var isEditing = state.isAdmin && state.editingLocationId === loc.id;

                html += '<div class="bg-slate-900/60 backdrop-blur-md border border-white/10 rounded-2xl sm:rounded-3xl overflow-hidden flex flex-col shadow-xl">';

                // Location Header
                if (isEditing) {
                    html += '<div class="p-4 sm:p-5 border-b border-white/5 bg-slate-800/80 flex flex-col gap-3">' +
                        '<input id="edit_name_' + loc.id + '" value="' + escapeHtml(loc.name) + '" placeholder="Location Name" class="w-full bg-slate-950 border border-white/10 text-white rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />' +
                        '<input id="edit_map_' + loc.id + '" value="' + escapeHtml(loc.address || '') + '" placeholder="Map URL / Address" class="w-full bg-slate-950 border border-white/10 text-white rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />' +
                        '<input id="edit_phone_' + loc.id + '" placeholder="Contact Phone" class="w-full bg-slate-950 border border-white/10 text-white rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />' +
                        '<div class="flex gap-2 justify-end mt-1">' +
                            '<button onclick="setEditingLocation(null)" class="px-4 py-2 bg-slate-700 text-white rounded-lg text-sm font-medium">Cancel</button>' +
                            '<button onclick="saveEditLocation(\'' + loc.id + '\')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium flex items-center gap-1"><i class="fa-solid fa-floppy-disk"></i> Save</button>' +
                        '</div>' +
                    '</div>';
                } else {
                    html += '<div class="p-4 sm:p-5 border-b border-white/5 bg-slate-800/40 flex justify-between items-start">' +
                        '<div>' +
                            '<h3 class="text-lg sm:text-xl font-bold text-white mb-2 flex items-center gap-2">' +
                                '<i class="fa-solid fa-location-dot text-indigo-400"></i>' +
                                '<span class="break-words">' + escapeHtml(loc.name) + '</span>' +
                            '</h3>' +
                            '<div class="flex flex-wrap items-center gap-2 sm:gap-4 mt-1">' +
                                (loc.address ? '<span class="bg-slate-900/80 text-xs sm:text-sm text-indigo-300 px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-white/5 shadow-sm"><i class="fa-solid fa-map"></i> ' + escapeHtml(loc.address) + '</span>' : '') +
                            '</div>' +
                        '</div>' +
                        (state.isAdmin ? 
                            '<div class="flex gap-1.5">' +
                                '<button onclick="setEditingLocation(\'' + loc.id + '\')" class="p-2 bg-slate-800 hover:bg-indigo-500/20 text-slate-400 hover:text-indigo-400 rounded-lg transition-colors border border-white/5"><i class="fa-solid fa-pen-to-square"></i></button>' +
                                '<button onclick="deleteLocation(\'' + loc.id + '\')" class="p-2 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-lg transition-colors border border-white/5"><i class="fa-solid fa-trash-can"></i></button>' +
                            '</div>' : '') +
                    '</div>';
                }

                // Admin Add Shift row
                if (state.isAdmin && !isEditing) {
                    html += '<div class="bg-slate-950/40 p-3 sm:p-4 border-b border-white/5 flex gap-2">' +
                        '<input id="new_shift_' + loc.id + '" placeholder="New timing (e.g., 08:00 AM - 10:00 AM)" class="flex-1 bg-slate-900 border border-white/10 text-white rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />' +
                        '<button onclick="addShift(\'' + loc.id + '\')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-md"><i class="fa-solid fa-plus"></i></button>' +
                    '</div>';
                }

                // Shifts Container
                html += '<div class="p-3 sm:p-5 flex-1 flex flex-col gap-4 sm:gap-6">';

                var locShifts = state.shifts.filter(function(s) { return s.location_id === loc.id; });

                if (locShifts.length === 0) {
                    html += '<p class="text-slate-500 text-xs sm:text-sm italic py-4 text-center border border-dashed border-slate-700 rounded-xl">No shifts configured for this station.</p>';
                } else {
                    for (var sIdx = 0; sIdx < locShifts.length; sIdx++) {
                        var shift = locShifts[sIdx];

                        // Find slot record for this shift & active date
                        var currentSlot = null;
                        for (var sl = 0; sl < state.slots.length; sl++) {
                            if (state.slots[sl].shift_id === shift.id && state.slots[sl].slot_date === activeDateKey) {
                                currentSlot = state.slots[sl];
                                break;
                            }
                        }

                        var regCap = currentSlot ? currentSlot.max_regular : (shift.regular_capacity || 2);
                        var sbyCap = currentSlot ? currentSlot.max_standby : (shift.standby_capacity || 1);

                        // Find confirmed bookings
                        var regBookings = [];
                        var sbyBookings = [];
                        if (currentSlot) {
                            for (var bk = 0; bk < state.bookings.length; bk++) {
                                if (state.bookings[bk].slot_id === currentSlot.id) {
                                    if (state.bookings[bk].booking_type === 'REGULAR') regBookings.push(state.bookings[bk]);
                                    if (state.bookings[bk].booking_type === 'STANDBY') sbyBookings.push(state.bookings[bk]);
                                }
                            }
                        }

                        html += '<div class="bg-slate-950/40 border border-white/5 rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-inner">' +
                            '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-white/5">' +
                                '<div class="text-indigo-300 font-bold text-sm sm:text-[15px] flex items-center gap-2">' +
                                    '<i class="fa-solid fa-clock text-indigo-400"></i> ' + escapeHtml(shift.shift_name) +
                                '</div>' +
                                (state.isAdmin ? 
                                    '<div class="flex flex-wrap items-center gap-2 sm:gap-4 bg-slate-900/80 p-1.5 sm:p-2 rounded-xl border border-white/5">' +
                                        '<div class="flex items-center gap-1.5 bg-slate-800/80 px-2 py-1 rounded-lg">' +
                                            '<span class="text-[10px] text-slate-400 uppercase tracking-wider font-bold mr-1">Reg:</span>' +
                                            '<button onclick="updateShiftSlots(\'' + loc.id + '\', \'' + shift.id + '\', \'slotsCount\', -1)" class="p-1 text-slate-400 hover:text-white bg-slate-700 rounded"><i class="fa-solid fa-minus text-[10px]"></i></button>' +
                                            '<span class="text-white text-xs font-bold w-3 text-center">' + regCap + '</span>' +
                                            '<button onclick="updateShiftSlots(\'' + loc.id + '\', \'' + shift.id + '\', \'slotsCount\', 1)" class="p-1 text-slate-400 hover:text-white bg-slate-700 rounded"><i class="fa-solid fa-plus text-[10px]"></i></button>' +
                                        '</div>' +
                                        '<div class="flex items-center gap-1.5 bg-slate-800/80 px-2 py-1 rounded-lg border border-amber-500/20">' +
                                            '<span class="text-[10px] text-amber-500/70 uppercase tracking-wider font-bold mr-1">Bak:</span>' +
                                            '<button onclick="updateShiftSlots(\'' + loc.id + '\', \'' + shift.id + '\', \'backupCount\', -1)" class="p-1 text-amber-500 hover:text-amber-300 bg-slate-700 rounded"><i class="fa-solid fa-minus text-[10px]"></i></button>' +
                                            '<span class="text-amber-400 text-xs font-bold w-3 text-center">' + sbyCap + '</span>' +
                                            '<button onclick="updateShiftSlots(\'' + loc.id + '\', \'' + shift.id + '\', \'backupCount\', 1)" class="p-1 text-amber-500 hover:text-amber-300 bg-slate-700 rounded"><i class="fa-solid fa-plus text-[10px]"></i></button>' +
                                        '</div>' +
                                        '<button onclick="deleteShift(\'' + shift.id + '\')" class="p-1.5 ml-auto sm:ml-0 text-slate-500 hover:text-red-400 bg-slate-800 rounded-lg transition-colors"><i class="fa-solid fa-trash-can"></i></button>' +
                                    '</div>' : '') +
                            '</div>';

                        // Regular Slots Render
                        if (regCap > 0) {
                            html += '<div class="space-y-2 sm:space-y-3 mb-4 sm:mb-5">';
                            for (var r = 0; r < regCap; r++) {
                                var assignedReg = regBookings[r];
                                if (assignedReg) {
                                    html += '<div class="flex items-center justify-between bg-indigo-500/10 border border-indigo-500/20 rounded-xl px-3 sm:px-4 py-2.5 sm:py-3 fade-in">' +
                                        '<div class="flex items-center gap-2 sm:gap-3">' +
                                            '<div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center">' +
                                                '<i class="fa-solid fa-users text-xs"></i>' +
                                            '</div>' +
                                            '<span class="font-semibold text-indigo-100 text-sm">' + escapeHtml(assignedReg.volunteer_name) + '</span>' +
                                        '</div>' +
                                        (state.isAdmin ? 
                                            '<button onclick="clearBooking(\'' + assignedReg.id + '\')" class="text-slate-500 hover:text-red-400 bg-slate-900/50 hover:bg-slate-800 p-1.5 rounded-lg transition-colors" title="Remove"><i class="fa-solid fa-trash-can"></i></button>' : '') +
                                    '</div>';
                                } else {
                                    html += '<div class="flex gap-2 items-center w-full fade-in">' +
                                        '<div class="relative flex-1">' +
                                            '<input id="input_' + loc.id + '_' + shift.id + '_regular_' + r + '" type="text" placeholder="Your name..." ' +
                                                'class="w-full bg-slate-950/50 border border-indigo-500/30 text-white rounded-xl pl-3 sm:pl-4 pr-8 py-2 sm:py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:border-indigo-500 focus:ring-indigo-500/50 placeholder-slate-500 transition-all shadow-inner" ' +
                                                'onkeydown="if(event.key === \'Enter\') saveSlot(\'' + loc.id + '\', \'' + shift.id + '\', \'regular\', ' + r + ')" />' +
                                            '<div class="absolute right-3 top-1/2 -translate-y-1/2 text-indigo-500/70">' +
                                                '<i class="fa-solid fa-users text-xs"></i>' +
                                            '</div>' +
                                        '</div>' +
                                        '<button onclick="saveSlot(\'' + loc.id + '\', \'' + shift.id + '\', \'regular\', ' + r + ')" ' +
                                            'class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 sm:p-2.5 rounded-xl transition-all shadow-md active:scale-95 flex-shrink-0">' +
                                            '<i class="fa-solid fa-check"></i>' +
                                        '</button>' +
                                    '</div>';
                                }
                            }
                            html += '</div>';
                        }

                        // Standby / Backup Slots Render
                        if (sbyCap > 0) {
                            html += '<div class="mt-3 sm:mt-4 pt-4 border-t border-white/5 relative">' +
                                '<span class="absolute -top-2.5 left-3 sm:left-4 bg-slate-900 px-2 text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-amber-500/80 flex items-center gap-1 rounded-sm">' +
                                    '<i class="fa-solid fa-user-shield"></i> Standby' +
                                '</span>' +
                                '<div class="space-y-2 sm:space-y-3 pt-1 sm:pt-2">';

                            for (var bIdx = 0; bIdx < sbyCap; bIdx++) {
                                var assignedSby = sbyBookings[bIdx];
                                if (assignedSby) {
                                    html += '<div class="flex items-center justify-between bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 sm:px-4 py-2.5 sm:py-3 fade-in">' +
                                        '<div class="flex items-center gap-2 sm:gap-3">' +
                                            '<div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center">' +
                                                '<i class="fa-solid fa-user-shield text-xs"></i>' +
                                            '</div>' +
                                            '<span class="font-semibold text-amber-100 text-sm">' + escapeHtml(assignedSby.volunteer_name) + '</span>' +
                                        '</div>' +
                                        (state.isAdmin ? 
                                            '<button onclick="clearBooking(\'' + assignedSby.id + '\')" class="text-slate-500 hover:text-red-400 bg-slate-900/50 hover:bg-slate-800 p-1.5 rounded-lg transition-colors"><i class="fa-solid fa-trash-can"></i></button>' : '') +
                                    '</div>';
                                } else {
                                    html += '<div class="flex gap-2 items-center w-full fade-in">' +
                                        '<div class="relative flex-1">' +
                                            '<input id="input_' + loc.id + '_' + shift.id + '_backup_' + bIdx + '" type="text" placeholder="Backup name..." ' +
                                                'class="w-full bg-slate-950/50 border border-amber-500/30 text-white rounded-xl pl-3 sm:pl-4 pr-8 py-2 sm:py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:border-amber-500 focus:ring-amber-500/50 placeholder-slate-500 transition-all shadow-inner" ' +
                                                'onkeydown="if(event.key === \'Enter\') saveSlot(\'' + loc.id + '\', \'' + shift.id + '\', \'standby\', ' + bIdx + ')" />' +
                                            '<div class="absolute right-3 top-1/2 -translate-y-1/2 text-amber-500/70">' +
                                                '<i class="fa-solid fa-user-shield text-xs"></i>' +
                                            '</div>' +
                                        '</div>' +
                                        '<button onclick="saveSlot(\'' + loc.id + '\', \'' + shift.id + '\', \'standby\', ' + bIdx + ')" ' +
                                            'class="bg-amber-600 hover:bg-amber-500 text-white p-2 sm:p-2.5 rounded-xl transition-all shadow-md active:scale-95 flex-shrink-0">' +
                                            '<i class="fa-solid fa-check"></i>' +
                                        '</button>' +
                                    '</div>';
                                }
                            }
                            html += '</div></div>';
                        }

                        html += '</div>'; // End single shift
                    }
                }

                html += '</div></div>'; // End location container
            }

            // Admin Add Location Section
            if (state.isAdmin) {
                html += '<div class="bg-indigo-950/20 border border-indigo-500/30 rounded-2xl sm:rounded-3xl p-4 sm:p-5 flex flex-col">' +
                    '<h3 class="text-base sm:text-lg font-bold text-indigo-300 mb-4 flex items-center gap-2">' +
                        '<i class="fa-solid fa-plus"></i> Add Duty Station' +
                    '</h3>' +
                    '<form onsubmit="addLocation(event)" class="space-y-3">' +
                        '<input id="new_loc_name" required placeholder="Station Name (e.g., Marine Drive Center)" class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />' +
                        '<input id="new_loc_map" placeholder="Address / Location Details (Optional)" class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />' +
                        '<input id="new_loc_phone" placeholder="Contact Phone (Optional)" class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />' +
                        '<button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl text-sm font-bold transition-all shadow-md mt-2">' +
                            'Create Station' +
                        '</button>' +
                    '</form>' +
                '</div>';
            }

            html += '</div></main>';

            // Admin Login Modal
            if (state.showAdminLogin) {
                html += '<div class="fixed inset-0 z-50 flex items-center justify-center p-4">' +
                    '<div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onclick="toggleAdminModal(false)"></div>' +
                    '<div class="bg-slate-900 border border-white/10 w-full max-w-sm rounded-3xl shadow-2xl relative z-10 p-5 sm:p-6 fade-in">' +
                        '<div class="flex items-center gap-3 mb-5 text-indigo-400">' +
                            '<i class="fa-solid fa-shield-halved text-2xl sm:text-3xl"></i>' +
                            '<h3 class="text-lg sm:text-xl font-bold text-white">Admin Clearance</h3>' +
                        '</div>' +
                        '<form onsubmit="handleAdminAuth(event)" class="space-y-4">' +
                            '<div>' +
                                '<label class="text-xs sm:text-sm text-slate-400 mb-2 block">Enter Security PIN</label>' +
                                '<input id="admin_pwd" type="password" placeholder="••••" class="w-full bg-slate-950 border border-white/10 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" autofocus />' +
                                (state.loginError ? '<p class="text-rose-400 text-xs mt-2 font-semibold">Incorrect PIN. Try 9847</p>' : '') +
                            '</div>' +
                            '<div class="flex gap-3 pt-2">' +
                                '<button type="button" onclick="toggleAdminModal(false)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-2.5 sm:py-3 rounded-xl text-sm font-medium transition-colors">Cancel</button>' +
                                '<button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 sm:py-3 rounded-xl text-sm font-medium transition-colors">Unlock</button>' +
                            '</div>' +
                        '</form>' +
                    '</div>' +
                '</div>';
            }

            html += '</div>';
            root.innerHTML = html;
        }

        // Initialize App on DOM Load
        document.addEventListener('DOMContentLoaded', function() {
            AppEngine.init();
        });
    </script>
</body>
</html>
